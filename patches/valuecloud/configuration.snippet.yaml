# ValueCloud CPR (EyeBond Local not required)
# Grid/line status poll is optional — not wired by default.
shell_command:
  valuecloud_set_cpr: '/config/shell/valuecloud_set_cpr.sh "{{ mode }}"'

# File sensor — 60s scan to limit SD wear (state only changes on file updates).
command_line:
  - sensor:
      name: ValueCloud CPR last
      unique_id: valuecloud_cpr_last
      command: "cat /config/shell/valuecloud_last_result.txt 2>/dev/null || echo none"
      scan_interval: 60
