# Cloud CPR schedule (HA timezone). Merge into config/automations.yaml.
- id: gootu_cpr_day_on
  alias: Gootu — day charging (Utility first)
  description: Allow grid charging during the day.
  mode: single
  triggers:
    - trigger: time
      at: "09:00:00"
  actions:
    - action: script.valuecloud_set_charging_priority
      data:
        mode: Utility first

- id: gootu_cpr_evening_quiet
  alias: Gootu — evening/night quiet (PV only)
  description: PV-only from 21:00 through morning until day automation runs.
  mode: single
  triggers:
    - trigger: time
      at: "21:00:00"
  actions:
    - action: script.valuecloud_set_charging_priority
      data:
        mode: PV only

- id: valuecloud_cpr_finished_notify
  alias: ValueCloud — notify CPR result
  description: Fires when background cloud CPR write updates the result file.
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.valuecloud_cpr_last
      not_to:
        - unknown
        - unavailable
        - none
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
  actions:
    - action: notify.send_message
      target:
        # Companion app notify entity, e.g. notify.mobile_app_phone
        entity_id: notify.YOUR_NOTIFY_ENTITY
      data:
        message: "ValueCloud CPR {{ trigger.to_state.state }}"
