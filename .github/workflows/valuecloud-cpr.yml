# Gootu CPR via ValueClouds — clock schedule (Europe/Kyiv) + manual dispatch.
#
# Secrets: VALUECLOUD_USERNAME, VALUECLOUD_PASSWORD, VALUECLOUD_PN, VALUECLOUD_SN
# Optional secrets: VALUECLOUD_DEVCODE, VALUECLOUD_DEVADDR
#
# Variables (Settings → Secrets and variables → Actions → Variables) — no commit needed:
#   VALUECLOUD_CPR_ENABLED   true|false  (pause cron; manual Run workflow still works)
#   VALUECLOUD_CPR_SCHEDULE  JSON hour→mode (Europe/Kyiv). Empty → built-in default.
#
# Cron runs every 15 minutes (GitHub hourly cron is often late/missed). Cache ensures
# each Kyiv schedule hour writes at most once.
#
# Results: open the run → Summary tab

name: ValueCloud CPR

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Charging priority to set
        required: true
        type: choice
        options:
          - Utility first
          - PV only
          - PV first
          - Utility + PV

permissions:
  contents: read
  actions: write

jobs:
  set-cpr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patches/valuecloud
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve mode (Kyiv gate or dispatch)
        id: gate
        env:
          FORCE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '' }}
          VALUECLOUD_CPR_ENABLED: ${{ vars.VALUECLOUD_CPR_ENABLED }}
          VALUECLOUD_CPR_SCHEDULE: ${{ vars.VALUECLOUD_CPR_SCHEDULE }}
        run: |
          if [ -n "$FORCE_MODE" ]; then
            python3 valuecloud_schedule_gate.py --force-mode "$FORCE_MODE"
          else
            python3 valuecloud_schedule_gate.py
          fi

      - name: Skip (paused / off-schedule)
        if: steps.gate.outputs.mode == 'SKIP'
        env:
          SKIP_REASON: ${{ steps.gate.outputs.reason }}
        run: |
          case "$SKIP_REASON" in
            paused) LABEL="paused (VALUECLOUD_CPR_ENABLED=false)" ;;
            not_schedule_hour) LABEL="skipped (not a schedule hour in Europe/Kyiv)" ;;
            *) LABEL="skipped (${SKIP_REASON:-unknown})" ;;
          esac
          {
            echo "## ValueCloud CPR"
            echo ""
            echo "- **Result:** $LABEL"
            echo "- **Slot:** \`${{ steps.gate.outputs.slot }}\`"
            echo "- **Event:** \`${{ github.event_name }}\`"
            echo "- **UTC:** $(date -u +'%Y-%m-%d %H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check if this Kyiv hour already wrote
        id: slotcache
        if: steps.gate.outputs.mode != 'SKIP'
        uses: actions/cache@v4
        with:
          path: /tmp/valuecloud-cpr-slot
          key: valuecloud-cpr-${{ steps.gate.outputs.slot }}-${{ steps.gate.outputs.mode }}

      - name: Skip (already done this hour)
        if: steps.gate.outputs.mode != 'SKIP' && steps.slotcache.outputs.cache-hit == 'true'
        run: |
          {
            echo "## ValueCloud CPR"
            echo ""
            echo "- **Result:** skipped (already wrote this Kyiv hour)"
            echo "- **Mode:** \`${{ steps.gate.outputs.mode }}\`"
            echo "- **Slot:** \`${{ steps.gate.outputs.slot }}\`"
            echo "- **Event:** \`${{ github.event_name }}\`"
            echo "- **UTC:** $(date -u +'%Y-%m-%d %H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write CPR
        id: write
        if: steps.gate.outputs.mode != 'SKIP' && steps.slotcache.outputs.cache-hit != 'true'
        env:
          VALUECLOUD_USERNAME: ${{ secrets.VALUECLOUD_USERNAME }}
          VALUECLOUD_PASSWORD: ${{ secrets.VALUECLOUD_PASSWORD }}
          VALUECLOUD_PN: ${{ secrets.VALUECLOUD_PN }}
          VALUECLOUD_SN: ${{ secrets.VALUECLOUD_SN }}
          VALUECLOUD_DEVCODE: ${{ secrets.VALUECLOUD_DEVCODE }}
          VALUECLOUD_DEVADDR: ${{ secrets.VALUECLOUD_DEVADDR }}
          VALUECLOUD_SHELL_DIR: ${{ runner.temp }}/valuecloud
          CPR_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          mkdir -p "$VALUECLOUD_SHELL_DIR"
          set +e
          python3 valuecloud_set_cpr.py --mode "$CPR_MODE"
          rc=$?
          set -e
          RESULT="(no result file)"
          if [ -f "$VALUECLOUD_SHELL_DIR/valuecloud_last_result.txt" ]; then
            RESULT=$(tr -d '\r' < "$VALUECLOUD_SHELL_DIR/valuecloud_last_result.txt" | head -n1)
          fi
          {
            echo "## ValueCloud CPR"
            echo ""
            if [ "$rc" -eq 0 ]; then
              echo "- **Result:** OK"
              mkdir -p /tmp/valuecloud-cpr-slot
              echo ok > /tmp/valuecloud-cpr-slot/done
            else
              echo "- **Result:** FAILED"
            fi
            echo "- **Mode:** \`$CPR_MODE\`"
            echo "- **Slot:** \`${{ steps.gate.outputs.slot }}\`"
            echo "- **Detail:** \`$RESULT\`"
            echo "- **Event:** \`${{ github.event_name }}\`"
            echo "- **UTC:** $(date -u +'%Y-%m-%d %H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
