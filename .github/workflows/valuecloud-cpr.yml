# Gootu CPR via ValueClouds — clock schedule (Europe/Kyiv) + manual dispatch.
# Secrets: VALUECLOUD_USERNAME, VALUECLOUD_PASSWORD, VALUECLOUD_PN, VALUECLOUD_SN
# Optional: VALUECLOUD_DEVCODE, VALUECLOUD_DEVADDR (defaults 2506 / 1)
#
# Control: edit HOUR_TO_MODE in valuecloud_schedule_gate.py | Disable workflow | Run workflow
# Results: open the run → Summary tab

name: ValueCloud CPR

on:
  schedule:
    # UTC :05 each hour; Kyiv gate decides whether to write (DST-safe).
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Charging priority to set
        required: true
        type: choice
        options:
          - Utility first
          - PV only
          - PV first
          - Utility + PV

permissions:
  contents: read

jobs:
  set-cpr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patches/valuecloud
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve mode (Kyiv gate or dispatch)
        id: gate
        env:
          FORCE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '' }}
        run: |
          if [ -n "$FORCE_MODE" ]; then
            MODE=$(python3 valuecloud_schedule_gate.py --force-mode "$FORCE_MODE" | tail -n1)
          else
            MODE=$(python3 valuecloud_schedule_gate.py | tail -n1)
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $MODE"

      - name: Skip off-schedule hour
        if: steps.gate.outputs.mode == 'SKIP'
        run: |
          {
            echo "## ValueCloud CPR"
            echo ""
            echo "- **Result:** skipped (not a schedule hour in Europe/Kyiv)"
            echo "- **Event:** \`${{ github.event_name }}\`"
            echo "- **UTC:** $(date -u +'%Y-%m-%d %H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write CPR
        id: write
        if: steps.gate.outputs.mode != 'SKIP'
        env:
          VALUECLOUD_USERNAME: ${{ secrets.VALUECLOUD_USERNAME }}
          VALUECLOUD_PASSWORD: ${{ secrets.VALUECLOUD_PASSWORD }}
          VALUECLOUD_PN: ${{ secrets.VALUECLOUD_PN }}
          VALUECLOUD_SN: ${{ secrets.VALUECLOUD_SN }}
          VALUECLOUD_DEVCODE: ${{ secrets.VALUECLOUD_DEVCODE }}
          VALUECLOUD_DEVADDR: ${{ secrets.VALUECLOUD_DEVADDR }}
          VALUECLOUD_SHELL_DIR: ${{ runner.temp }}/valuecloud
          CPR_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          mkdir -p "$VALUECLOUD_SHELL_DIR"
          set +e
          python3 valuecloud_set_cpr.py --mode "$CPR_MODE"
          rc=$?
          set -e
          RESULT="(no result file)"
          if [ -f "$VALUECLOUD_SHELL_DIR/valuecloud_last_result.txt" ]; then
            RESULT=$(tr -d '\r' < "$VALUECLOUD_SHELL_DIR/valuecloud_last_result.txt" | head -n1)
          fi
          {
            echo "## ValueCloud CPR"
            echo ""
            if [ "$rc" -eq 0 ]; then
              echo "- **Result:** OK"
            else
              echo "- **Result:** FAILED"
            fi
            echo "- **Mode:** \`$CPR_MODE\`"
            echo "- **Detail:** \`$RESULT\`"
            echo "- **Event:** \`${{ github.event_name }}\`"
            echo "- **UTC:** $(date -u +'%Y-%m-%d %H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
