# HA owns the CPR clock (Europe/Kyiv). GitHub Actions is optional backup —
# keep VALUECLOUD_CPR_ENABLED=false (or disable that workflow) to avoid double-writes.
# Replace notify.YOUR_NOTIFY_ENTITY.

- id: gootu_cpr_schedule
  alias: Gootu CPR — day/night schedule
  description: >-
    Clock-based charging priority (no SoC). Utility first at 08/14/17,
    PV only at 11/15/21.
  mode: single
  triggers:
    - trigger: time
      at: "08:00:00"
      id: utility
    - trigger: time
      at: "11:00:00"
      id: pv
    - trigger: time
      at: "14:00:00"
      id: utility
    - trigger: time
      at: "15:00:00"
      id: pv
    - trigger: time
      at: "17:00:00"
      id: utility
    - trigger: time
      at: "21:00:00"
      id: pv
  actions:
    - variables:
        mode: "{% if trigger.id == 'pv' %}PV only{% else %}Utility first{% endif %}"
    - action: script.valuecloud_set_charging_priority
      data:
        mode: "{{ mode }}"

- id: valuecloud_notify
  alias: ValueCloud — notify CPR result
  description: Phone notify when cloud CPR write updates the result file.
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.valuecloud_cpr_last
      not_to:
        - unknown
        - unavailable
        - none
        - ""
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
  actions:
    - action: notify.send_message
      target:
        entity_id: notify.YOUR_NOTIFY_ENTITY
      data:
        message: "{{ trigger.to_state.state }}"
